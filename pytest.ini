[pytest]
testpaths = tests

# Warning policy
# ==============
# No category is ignored wholesale.  Every entry below is pinned to a specific
# message and, where possible, the module that raises it, so a NEW warning of
# the same category still surfaces.
#
# Numerical warnings are promoted to errors: an overflow, an invalid value or a
# divide-by-zero inside the model is a result-changing event, not a note.  The
# suite emits none today, so this costs nothing and catches the next one.
filterwarnings =
    default
    error::RuntimeWarning

    # --- third-party: scikit-learn calls a pandas API pandas has deprecated ---
    # ~5 500 occurrences, all from RandomForest/permutation_importance inside
    # sklearn's own validation layer.  Nothing in this repository calls
    # is_sparse; it is fixed by upgrading scikit-learn, not by changing our
    # code.  Pinned to the message AND the raising module, so any other
    # deprecation from those modules still surfaces.
    #
    # The category is spelled DeprecationWarning, not pandas.errors.Pandas4Warning
    # (its actual class, which subclasses it).  Naming the pandas class would
    # force pytest to import pandas while parsing this file -- before any
    # conftest runs -- and pandas emits import-time warnings of its own, which
    # would then be impossible to filter.  The base class is equally precise
    # here because the message and module are both pinned.
    ignore:is_sparse is deprecated:DeprecationWarning:sklearn.utils.validation
    ignore:is_sparse is deprecated:DeprecationWarning:pandas.core.algorithms

    # --- third-party: optional pandas accelerators are older than pandas wants ---
    # Environment note, emitted once each at import.  Neither package is used by
    # this project; pandas degrades to its own implementations.
    ignore:Pandas requires version .* of 'numexpr':UserWarning
    ignore:Pandas requires version .* of 'bottleneck':UserWarning

    # --- ours, deliberately not fixed: SALib renamed its Saltelli sampler ---
    # SALib.sample.sobol is NOT a drop-in replacement.  It scrambles the Sobol'
    # sequence by default, so it returns a DIFFERENT design: comparing the two
    # at N = 8, 16 and 1024 gives a maximum deviation of ~1.6e2 in parameter
    # units, not zero.  Switching would invalidate the committed
    # data/saltelli_results_K{6,8,9}.csv, whose 30 720 evaluations are verified
    # row-by-row against saltelli.sample.  Migrating means regenerating that
    # design and re-running the sensitivity analysis; until then the legacy
    # entry point is the correct one and this warning is expected.
    ignore:`salib.sample.saltelli` will be removed:DeprecationWarning:saltelli_sensitivity
